name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Data integrity (errata schema, raw dataset shape)
        run: python3 skill/scripts/check_data_integrity.py

      - name: Broken relative markdown links
        run: python3 skill/scripts/check_links.py

      - name: Domain stats reproducibility smoke test
        run: python3 skill/scripts/compute_domain_stats.py

      # Runs the extractor and validates its output shape. Lives in a real script
      # (not an inline snippet here) so the exact same gate runs locally -- the
      # previous inline version asserted "every packet has exactly 2 Champions,"
      # which the extractor was fixed to stop assuming on 2026-08-18, and CI went
      # red for five commits while every local script stayed green.
      - name: Legend packet extraction + shape check
        run: python3 skill/scripts/check_legend_packets.py
