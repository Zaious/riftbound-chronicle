name: CI

on:
  push:
  pull_request:

# Every gate below is a real script under skill/scripts/ that exits non-zero on
# failure -- never an inline assertion written only in this file. Reason: an
# inline "every packet has exactly 2 Champions" assertion here once went red for
# five consecutive commits while every locally-runnable script stayed green,
# because the assertion existed nowhere a developer would run it. If a check is
# worth having in CI, it's worth being runnable locally by the same command.
#
# All checks are also run once from a working directory OUTSIDE the repo, by
# absolute path, to prove they don't depend on cwd (a portability audit item --
# the skill is meant to be symlinked/copied anywhere).

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Data integrity (errata schema/freshness/residue, raw dataset shape, Domain population vs prose)
        run: python3 skill/scripts/check_data_integrity.py

      - name: Empowered counts where a card's text permits it (Core 442.1.c.1, 443.1)
        run: python3 skill/scripts/check_empower_levels.py

      - name: A replacement sees only the events the rules have (Core 355.6, 370.1.a)
        run: python3 skill/scripts/check_replacement_precision.py

      - name: Swapping two Units' Might is two Might changes over one snapshot (Core 479)
        run: python3 skill/scripts/check_swap_might.py

      - name: A limited Might change is remembered, not recomputed (Core 479.4.b)
        run: python3 skill/scripts/check_might_limit_snapshot.py

      - name: A token card's printed activated abilities are carried, listed and paid (the Gold gear token)
        run: python3 skill/scripts/check_token_abilities.py

      - name: A card's own Energy reduction per card played this turn or per Mighty unit, with a printed minimum (Core 356.4)
        run: python3 skill/scripts/check_self_cost_counts.py

      - name: A static aura over the friendly Units of one tag, the source included when it carries it (Core 133.8, 479.3.b)
        run: python3 skill/scripts/check_tag_auras.py

      - name: Two set-2 play watches - a spell on an opponent's turn, a card with Power cost N or more (Core 206)
        run: python3 skill/scripts/check_set2_play_watches.py

      - name: "Your spells and abilities deal N bonus damage" lowered with its printed N (Core 713-715)
        run: python3 skill/scripts/check_set2_bonus_damage_text.py

      - name: A won combat wakes the winner's and the winning units' watchers before control (Core 468.3.a, 468.3.c, 468.4)
        run: python3 skill/scripts/check_combat_won.py

      - name: A card's own optional Energy, or Energy and one rune, offer for its play (Core 356.2.b)
        run: python3 skill/scripts/check_set2_energy_offers.py

      - name: A Battlefield's Conquer trigger with N or more Mighty units here (Core 383.2.a.1, 708)
        run: python3 skill/scripts/check_set2_conquer_mighty.py

      - name: A card an opponent's spells and abilities cannot choose (Core 355.5)
        run: python3 skill/scripts/check_unchoosable_by_enemies.py

      - name: A permanent's 'Units can't move to base' restricts every such move while it is on the board (Core 359.3.e.6)
        run: python3 skill/scripts/check_move_to_base_restricted.py

      - name: A Battlefield where Units can't be played (Core 355.2)
        run: python3 skill/scripts/check_units_not_played_here.py

      - name: A Battlefield no player scores before their Nth turn (Core 471, 472)
        run: python3 skill/scripts/check_no_score_before_turn.py

      - name: Resource conversion - any amount of Energy or Power paid, that much added (Core 204.3.a, 430)
        run: python3 skill/scripts/check_resource_conversion.py

      - name: Each attached Equipment of the controller's gives its unit [Assault] (Core 807.2)
        run: python3 skill/scripts/check_equipment_each_give.py

      - name: A card played only to a battlefield its player conquered this turn (Core 355.2, 471.1)
        run: python3 skill/scripts/check_conquered_only.py
      - name: Became Mighty watch (set 2 A2, Fiora; Core 709)
        run: python3 skill/scripts/check_became_mighty.py
      - name: Targeting Effects - when you choose me with a spell, a friendly unit (set 2 A2; Core 383.4.b)
        run: python3 skill/scripts/check_targeted_watch.py
      - name: A card's own reduction for a play from outside the hand (set 2 A2; Core 356.4)
        run: python3 skill/scripts/check_cost_not_from_hand.py
      - name: When you use an activated ability of a gear (set 2 A2; Core 377.2)
        run: python3 skill/scripts/check_ability_used_watch.py
      - name: Your units here have a keyword, the source included (set 2 A2; Core 365.1)
        run: python3 skill/scripts/check_units_here_aura.py
      - name: A tag given by a card's own text or an Effect Text (set 2 A2; Core 133.8, 435.1.c)
        run: python3 skill/scripts/check_tag_grant.py
      - name: An Effect Text's Might while attached this turn (set 2 A2; Core 435.1.c)
        run: python3 skill/scripts/check_attached_this_turn.py
      - name: A printed additional cost paid by returning a friendly gear to hand (set 2 A2; Core 356.2.a.1)
        run: python3 skill/scripts/check_return_cost.py
      - name: A trigger's base cost returning a unit here to hand (set 2 A2; Core 383.3.b.1, 448.2)
        run: python3 skill/scripts/check_trigger_return_cost.py
      - name: An optional printed cost killing a friendly gear (set 2 A2; Core 356.2.b)
        run: python3 skill/scripts/check_kill_gear_offer.py
      - name: When I attack or defend one on one; a Might change this combat (set 2 A2; Core 740.2.b)
        run: python3 skill/scripts/check_one_on_one.py
      - name: When you defend at a battlefield, move me there (set 2 A2; Core 383.4.f)
        run: python3 skill/scripts/check_defend_move_there.py
      - name: If you do, then do this - attach the card a play put on the board (set 2 A3; Core 388.2, 337.2)
        run: python3 skill/scripts/check_reflexive_after_play.py
      - name: The first time I conquer each turn (set 2 A2; Core 471.1, 383.1)
        run: python3 skill/scripts/check_first_conquer.py
      - name: An "other unit" set of targets, played plainly and copied by Repeat (set 2 A2; Core 820.1.d)
        run: python3 skill/scripts/check_distinct_target_group.py
      - name: Up to three units at the same location, a Battlefield or a Base (set 2 A2; Core 355.11, 198.1)
        run: python3 skill/scripts/check_same_location_group.py
      - name: Counter a spell unless its controller pays Energy (set 2 A2; Core 426.1, 355.10.e)
        run: python3 skill/scripts/check_unless_pay.py
      - name: A payment window's answers are every state the payer's Add Reactions reach (set 2 A2 review; Core 445.2.c)
        run: python3 skill/scripts/check_payment_window_adds.py
      - name: Move to a location where there is a unit with the same controller (set 2 A2; Core 355.4.a, 198.1)
        run: python3 skill/scripts/check_move_same_controller.py
      - name: Hold and conquer abilities interchangeable through an Effect Text (set 2 A2; Core 383.4.c-d, 435.1.c)
        run: python3 skill/scripts/check_score_effects_interchangeable.py
      - name: A friendly unit anywhere and an enemy unit at a battlefield deal their Mights to each other (set 2 A2)
        run: python3 skill/scripts/check_pair_located.py
      - name: When you choose or ready me (set 2 A2; Core 383.4.b, 416)
        run: python3 skill/scripts/check_choose_or_ready_me.py
      - name: Your Equipment everywhere have Quick-Draw (set 2 A2; Core 819.1.b, 819.1.d)
        run: python3 skill/scripts/check_quick_draw_aura.py
      - name: Each Equipment attached to me gives double its base Might bonus (set 2 A2; Core 159.1)
        run: python3 skill/scripts/check_equipment_bonus_double.py
      - name: When I conquer or hold - one ability, two trigger conditions (set 2 A2; Core 383.4.c-d)
        run: python3 skill/scripts/check_conquer_or_hold.py
      - name: An Effect Text replacement about its Top-Most card (set 2 A2; Core 370.1.b, 435.1.c)
        run: python3 skill/scripts/check_effect_text_replacement.py
      - name: The next spell you play this turn gets a Repeat at its own cost (set 2 A2; Core 392, 820.1)
        run: python3 skill/scripts/check_next_spell_repeat.py
      - name: A Recycle-from-trash cost limited to one card kind (set 2 A2; Core 417.3)
        run: python3 skill/scripts/check_recycle_kind_cost.py
      - name: I have +1 Might for each friendly gear (set 2 A2; Core 479.4.b)
        run: python3 skill/scripts/check_might_per_gear.py
      - name: While I'm at a battlefield, opponents can't gain points (set 2 A2; Core 054.1, 473.1)
        run: python3 skill/scripts/check_opponents_cant_gain_points.py
      - name: I can be played to a battlefield you're attacking (set 2 A2; Core 355.2.b)
        run: python3 skill/scripts/check_play_to_attacking_battlefield.py
      - name: Friendly Repeat costs cost less while you control this battlefield (set 2 A2; Core 356.4.c)
        run: python3 skill/scripts/check_repeat_cost_discount.py
      - name: The first friendly non-token gear played each turn costs less (set 2 A2; Core 356.4.b)
        run: python3 skill/scripts/check_first_gear_discount.py
      - name: When I die in combat; the first time I win a combat each turn (set 2 A2; Core 383.2.a.1, 468.3)
        run: python3 skill/scripts/check_die_in_combat.py
      - name: Choose an opponent; they score a point (set 2 A2; Core 473.1.a.1)
        run: python3 skill/scripts/check_gain_point_chosen.py
      - name: As I'm revealed from your deck, Add Energy (set 2 A2; Core 425, 430)
        run: python3 skill/scripts/check_revealed_from_deck_add.py
      - name: A reflexive trigger's base cost, paid at finalization (set 2 A2 Guards!; Core 388.4, 383.3.b)
        run: python3 skill/scripts/check_reflexive_trigger_cost.py
      - name: Cost [1] or [A] less, one component the payer chooses (set 2 A2; Core 356.4.c)
        run: python3 skill/scripts/check_either_cost_discount.py
      - name: Entry paths read the entry-state turn effects (set 2 A2 Bushwhack; boundary)
        run: python3 skill/scripts/check_entry_paths.py
      - name: A dual-Domain card's Power, any of its Domains (Core 135.2.e.6.c)
        run: python3 skill/scripts/check_power_of_domains.py
      - name: A card's own Energy reduction while its player controls a tagged Unit (Production Surge)
        run: python3 skill/scripts/check_cost_control_tag.py
      - name: Spells cost less / more while a permanent is in combat (Vex - Cheerless)
        run: python3 skill/scripts/check_cost_in_combat.py
      - name: A Gear played from hand ignoring its Energy cost this turn (Jayce - Man of Progress)
        run: python3 skill/scripts/check_gear_play_ignoring_energy.py
      - name: A Gold's Add bonus and the player-level hold trigger (Renata Glasc - Chem-Baroness)
        run: python3 skill/scripts/check_gold_add_bonus.py
      - name: Attach or detach a chosen Equipment of the chosen unit's controller (Angle Shot)
        run: python3 skill/scripts/check_attach_or_detach.py
      - name: An equipped unit deals its Might one way, then an Equipment detached (Strike Down)
        run: python3 skill/scripts/check_strike_down.py
      - name: A unit's conquer of an uncontrolled battlefield (Yone - Blademaster)
        run: python3 skill/scripts/check_conquer_uncontrolled.py
      - name: Exhaust your legend as an optional cost; a group move to an open battlefield (Bard - Mercurial)
        run: python3 skill/scripts/check_bard_mercurial.py
      - name: Each player's own optional Gold, one more per opponent who took one (Card Sharp)
        run: python3 skill/scripts/check_card_sharp.py
      - name: A token per Equipment you control; up to two of them readied (Arise!)
        run: python3 skill/scripts/check_arise.py
      - name: A unit that deals no combat damage adds nothing to its side (Ezreal - Dashing)
        run: python3 skill/scripts/check_no_combat_damage.py
      - name: Swap with a unit you control, attach one of its Equipment to me, once per turn (Azir - Ascendant)
        run: python3 skill/scripts/check_azir_ascendant.py
      - name: Sand Soldiers with Weaponmaster, a token's play keyword, played an Equipment this turn (Azir - Emperor)
        run: python3 skill/scripts/check_azir_emperor.py
      - name: Recycle another friendly unit to play a Mech from the trash, cheaper by its Might (Rumble - Hotheaded)
        run: python3 skill/scripts/check_rumble_hotheaded.py
      - name: Move, attach up to one Equipment, a conquer trigger granted this turn (Relentless Pursuit)
        run: python3 skill/scripts/check_relentless_pursuit.py
      - name: A triggered ability's mode chosen at finalization, not one chosen this turn (for Aphelios - Exalted)
        run: python3 skill/scripts/check_modal_trigger.py
      - name: Svellsongur's copy of its Top-Most card's printed text, and Aphelios's modes per instance (set 2 A3)
        run: python3 skill/scripts/check_copy_text_and_modes.py
      - name: Linked abilities - a granted Deathknell's banishment played by its granting card (The Zero Drive)
        run: python3 skill/scripts/check_zero_drive.py
      - name: If it was an enemy / friendly unit (linked_object_relation)
        run: python3 skill/scripts/check_linked_object_relation.py
      - name: If it's an Equipment, you may detach it (linked_object_has_tag, detach subject_ref)
        run: python3 skill/scripts/check_detach_if_equipment.py
      - name: Play a unit from hand to a battlefield you control (limited_play entry)
        run: python3 skill/scripts/check_play_to_controlled_battlefield.py
      - name: I cost less for each point you scored from holding this turn (hold ledger, power reduction)
        run: python3 skill/scripts/check_cost_per_hold_point.py
      - name: When you play this from face down, attach it to a unit you control (here)
        run: python3 skill/scripts/check_attach_self_from_facedown.py
      - name: Enemy units or gear chosen this turn with spells or unit abilities (ledger and condition)
        run: python3 skill/scripts/check_enemy_choices.py
      - name: Attach a detached / an attached Equipment you control to a unit you control (object_target)
        run: python3 skill/scripts/check_attach_chosen_equipment.py
      - name: A Battlefield's ability granted to its controller's Legends (legend_ability_grants)
        run: python3 skill/scripts/check_granted_legend_ability.py

      - name: Weaponmaster pays a chosen Equipment's Equip cost less one any-domain Power and attaches it (Core 821)
        run: python3 skill/scripts/check_weaponmaster.py

      - name: Quick-Draw plays an Equipment at Reaction timing and attaches it to a chosen unit you control (Core 819)
        run: python3 skill/scripts/check_quick_draw.py

      - name: Equip attaches an Equipment to a chosen unit you control, at any location (ADR-0017, Core 818)
        run: python3 skill/scripts/check_equip.py

      - name: An Equipment's Effect Text is its Top-Most card's, and its own rules text is Inactive while attached (ADR-0017)
        run: python3 skill/scripts/check_equipment_text.py

      - name: The engine's speed-ups answer as the engine did without them (state_copy, validation cache)
        run: python3 skill/scripts/check_engine_speedups.py

      - name: A Buff counter contributes its +1 Might (Core 703)
        run: python3 skill/scripts/check_buff_contributes_might.py

      - name: A card that says you score a point gains it and Scores no Battlefield (Core 473.1)
        run: python3 skill/scripts/check_gain_point.py

      - name: Broken relative markdown links + fragment anchors
        run: python3 skill/scripts/check_links.py

      - name: Domain stats reproducibility smoke test
        run: python3 skill/scripts/compute_domain_stats.py

      - name: Legend packet extraction + shape check
        run: python3 skill/scripts/check_legend_packets.py

      - name: Deck-primer worked examples follow the eight-section contract
        run: python3 skill/scripts/check_deck_primer.py

      # Fires when a mode is routed in SKILL.md but the READMEs still describe the
      # old set -- README maintenance is split from feature work, so this is what
      # tells the doc author that the code moved.
      - name: READMEs match routed modes, cited counts, and referenced paths
        run: python3 skill/scripts/check_readme_sync.py

      # Derives each system's engine-connection status from its artifacts and
      # fails if any README (or the checklist audit table) claims otherwise.
      - name: README engine-connection claims match the artifacts
        run: python3 skill/scripts/check_readme_connection_claims.py

      - name: Deck Coach schema, roles, cases, and artifact regressions
        run: python3 skill/scripts/check_deck_coach.py

      - name: Card behavior manifest and Deck Coach coverage boundary
        run: python3 skill/scripts/check_card_behavior_coverage.py

      - name: First R3 pack selection scope and source boundary
        run: python3 skill/scripts/check_r3_pack_selection.py

      - name: Deck Coach static prototype contract
        run: python3 skill/scripts/check_deck_coach_prototype.py

      # Advisory (exit 0): lists Tier 2 rows older than the last format event
      # (set release / ban wave / rules revision) so the next re-check pass has a
      # worklist. Not a failure -- stale isn't wrong, it's "worth re-checking".
      - name: Tier 2 freshness report (advisory)
        run: python3 skill/scripts/check_tier2_freshness.py

      - name: Tournament decklist store (shape, environment, cap, provenance)
        run: python3 skill/scripts/check_tournament_lists.py

      - name: P2-A manual-authority protocol regressions
        run: python3 skill/scripts/check_p2a_protocol.py

      - name: P2-A static prototype contract
        run: python3 skill/scripts/check_p2a_prototype.py

      - name: Rule Consult sources, cases, schema, and authority regressions
        run: python3 skill/scripts/check_rule_consult.py

      - name: Bilingual rules-index retrieval, ranking, and stale masking
        run: python3 skill/scripts/check_rules_index.py

      - name: Sovereign rules core timing and permission conformance
        run: python3 skill/scripts/check_rules_core.py

      - name: Typed effect IR atomic semantics and fail-closed coverage
        run: python3 skill/scripts/check_effect_ir.py

      # Properties over generated programs rather than chosen ones: a case
      # author picks inputs, and unconsciously picks the ones that work.
      - name: Effect IR purity, determinism, atomic rollback, and hash portability
        run: python3 skill/scripts/check_effect_ir_properties.py

      - name: Atomic timing and typed-effect resolution bridge
        run: python3 skill/scripts/check_resolution_bridge.py

      - name: Shared engine-check envelope and runner
        run: python3 skill/scripts/check_engine_check.py

      # Runs the commands the reference actually prints, against the bundled
      # example inputs. Documented commands otherwise rot silently -- a reader
      # finds the breakage, not CI.
      - name: Documented engine-check CLI commands and failure surface
        run: python3 skill/scripts/check_engine_check_cli.py

      # ADR-0002: the manifest is derived from the engine, so a stale committed
      # copy, an over- or under-stated capability, or a tampered build hash
      # all fail here rather than in a consumer.
      - name: Engine capability manifest derives from the engine and binds optionally
        run: python3 skill/scripts/check_capability_manifest.py

      # ADR-0003 Phase A: caller-supplied candidates only. Fails on hidden
      # information reaching a Player 2 query, on hindsight facts changing a
      # verdict, on any complete-action-set claim, and on stale fixtures.
      - name: Bounded legal-action service reaches all five verdicts and never enumerates
        run: python3 skill/scripts/check_legal_action.py

      # R5-A: measurement only. Runs every existing fixture through the real
      # engines; fails on a stale report, an empty abstention bucket, or any
      # search/policy/P2-S claim.
      - name: R5-A coverage and abstention report is deterministic and refuses learning claims
        run: python3 skill/scripts/check_r5a_report.py

      # R3-A0: the Annie / Master Yi clause inventory is generated from the
      # card snapshot plus errata; fails when stale, when a selected card does
      # not resolve to an Origins printing, when any program id appears (A0
      # builds none), or when the manifest is anything but draft.
      - name: R3-A0 clause inventory derives from card text and errata, draft only
        run: python3 skill/scripts/check_r3_inventory.py

      # C-13: R3-A1 locators, decision points, fixture drafts and decision
      # packets. Fails when stale, when a clause lacks a Core citation, or when
      # any draft smuggles an expected outcome or a program in.
      - name: R3-A1 ledger cites Core for every clause and drafts fixtures without outcomes
        run: python3 skill/scripts/check_r3a1_ledger.py

      # ADR-0006: Deck Coach consumes engine-check.v1 as rules-consistency
      # evidence only. Fails if attaching a check changes content, if the pair
      # is split, if a decision is resolved in the session, or if the prototype
      # renders anything but the shared read-only viewer.
      - name: Deck Coach engine-evidence intake is consume-only and content-preserving
        run: python3 skill/scripts/check_deck_coach_engine_intake.py

      # ADR-0005 C-14: engine-decisions.v1, derived target status, object
      # identity across non-board transitions, multi-target expansion with
      # typed instruction outcomes. Fails on caller-overridden targeting, on a
      # stale or wrong-stage decision being applied, and on a revalidation that
      # accepts an object that has been through a non-board zone.
      - name: Engine decisions, typed selectors, object identity and mistarget traces
        run: python3 skill/scripts/check_engine_decisions.py

      # ADR-0005 C-15: the play transaction is atomic — every failure after
      # payment restores the pre-play state — and the cost receipt is the only
      # evidence a cost predicate may test.
      - name: Atomic play transaction, typed cost receipts, cost predicates
        run: python3 skill/scripts/check_play_transaction.py

      # ADR-0005 C-16: return, recall and channel are three events. Fails if a
      # return keeps anything of the old object, a recall fires as a move or
      # drops damage, or a short channel claims full completion.
      - name: Return, recall and channel are distinct zone events
        run: python3 skill/scripts/check_zone_ops.py

      # ADR-0005 C-17: linked predicates read the earlier instruction's event
      # (a replaced action is not performed) and "If this kills it" is a
      # reflexive trigger built only after Cleanup with 429.5.c attribution.
      - name: Linked-result predicates and conditional reflexive triggers
        run: python3 skill/scripts/check_linked_predicates.py

      # C-18: card programs are fixtures with cited expectations; the behavior
      # manifest is derived from them passing. Fails on a claim outranking
      # its evidence, a stale clause gaining a program, or a stale output.
      - name: R3-A1 card programs pass and the behavior manifest is derived from them
        run: python3 skill/scripts/check_r3a1_programs.py

      # Source-level uniqueness: one dispatch branch per supported op in
      # _apply_one, no duplicated top-level def/class (a patch applied twice
      # once left a dead second copy of three ops).
      - name: Effect IR dispatch is unique per operation
        run: python3 skill/scripts/check_op_dispatch.py

      # ADR-0007 C-19: permanents enter by an explicit procedure; play
      # triggers fire on play completion; open-Battlefield permission is
      # checked at play. Fails on a claimed control transfer or a trigger
      # raised by mere entry.
      - name: Permanent entry, play triggers, open-Battlefield permission
        run: python3 skill/scripts/check_permanent_play.py

      # A triggered ability's targets are bound when it is finalized and recorded on
      # the chain item; resolution uses the record and never re-chooses. Its program is
      # dispatched by ID and refused if the content under that ID changed.
      - name: Trigger finalization binds targets and dispatches the program by content
        run: python3 skill/scripts/check_trigger_finalization.py

      # A triggered ability's base cost ("[do X] to [do Y]" opening its effect, Core 204.1.c,
      # 383.3.b) is paid as it is finalized, with the play transaction's cost machinery;
      # declined or unpayable, the ability leaves the Chain unfinalized and nothing is paid
      # (405.2, 203.3); resolution reads the receipt and pays nothing again.
      - name: Trigger base cost paid at finalization
        run: python3 skill/scripts/check_trigger_cost.py

      # An effect-driven play (Core 420.3): the instruction takes the play's step 1 - the card to
      # the Chain, Pending (354) - and the play transaction takes steps 2 to 5 from there once the
      # effect has resolved (354.3), with the effect's permission and cost change; an unpayable
      # play is cancelled (358.5) and the effect's earlier instructions stand (GPT 2026-09-25).
      - name: Effect-driven play through the play transaction
        run: python3 skill/scripts/check_limited_play.py
      - name: A triggered ability plays its own card from the trash
        run: python3 skill/scripts/check_limited_play_self.py
      - name: A card from a Main Deck banished, then played from Banishment
        run: python3 skill/scripts/check_limited_play_deck.py
      - name: Effect victory (The Grand Plaza, Core 195-196)
        run: python3 skill/scripts/check_effect_victory.py
      - name: Damage prevention (Unyielding Spirit, Kayn - Unleashed)
        run: python3 skill/scripts/check_damage_prevention.py
      - name: Option branch (Qiyana - Victorious)
        run: python3 skill/scripts/check_option_branch.py
      - name: A banished card played by its owner to their Base (package 9, Portal Rescue)
        run: python3 skill/scripts/check_owner_play.py
      - name: A Unit's Might raised this turn to another's (package 9, Convergent Mutation)
        run: python3 skill/scripts/check_raise_might.py
      - name: The next spell played this turn deals Bonus Damage (package 9, Ravenborn Tome)
        run: python3 skill/scripts/check_next_spell_bonus.py
      - name: A spell played from the trash recycled as it leaves the Chain (package 9, Kai'Sa)
        run: python3 skill/scripts/check_chain_leave_recycle.py
      - name: An opponent's Move to another Battlefield (package 9, Volibear - Imposing)
        run: python3 skill/scripts/check_opponent_move_watch.py
      - name: Any number of buffs (package 9, Lee Sin - Ascetic)
        run: python3 skill/scripts/check_buff_count.py
      - name: A card banished as it is seen from the top, then played for [A] (package 9, Nocturne)
        run: python3 skill/scripts/check_seen_banish.py
      - name: Ready and buff watches (package 10)
        run: python3 skill/scripts/check_ready_buff_watch.py
      - name: Conquer unit-count condition (package 10)
