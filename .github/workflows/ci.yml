name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Data integrity (errata schema, raw dataset shape)
        run: python3 skill/scripts/check_data_integrity.py

      - name: Broken relative markdown links
        run: python3 skill/scripts/check_links.py

      - name: Domain stats reproducibility smoke test
        run: python3 skill/scripts/compute_domain_stats.py

      - name: Legend packet extraction smoke test
        run: |
          python3 skill/scripts/extract_legend_packets.py --out /tmp/legend_packets_ci.json
          python3 -c "
          import json
          with open('/tmp/legend_packets_ci.json', encoding='utf-8') as f:
              packets = json.load(f)
          irregular = [p for p in packets if len(p['champions']) != 2]
          assert len(packets) >= 46, f'expected at least 46 Legend packets, got {len(packets)}'
          assert not irregular, f'{len(irregular)} Legend(s) without exactly 2 Champions: {[p[\"legend_name\"] for p in irregular]}'
          print(f'OK: {len(packets)} Legend packets, all with exactly 2 Champions.')
          "
