name: CLA

# Contributor License Agreement gate. A pull request from an author who has
# not signed CLA.md stays red; signing is one comment on the pull request,
# recorded once in signatures/version1/cla.json on the main branch.
# Reporting an issue needs no signature - only code, data and docs do.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Zaious/riftbound-chronicle/blob/main/CLA.md'
          branch: 'main'
          allowlist: Zaious,dependabot[bot],bot*
          custom-notsigned-prcomment: 'Thank you for the pull request. Before it can be merged, please read [CLA.md](https://github.com/Zaious/riftbound-chronicle/blob/main/CLA.md) and, if you agree, comment the sentence below. Reporting an issue never needs this; only code, data and documentation do.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
          lock-pullrequest-aftermerge: false
