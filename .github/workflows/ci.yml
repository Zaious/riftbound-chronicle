name: CI

on:
  push:
  pull_request:

# Every gate below is a real script under skill/scripts/ that exits non-zero on
# failure -- never an inline assertion written only in this file. Reason: an
# inline "every packet has exactly 2 Champions" assertion here once went red for
# five consecutive commits while every locally-runnable script stayed green,
# because the assertion existed nowhere a developer would run it. If a check is
# worth having in CI, it's worth being runnable locally by the same command.
#
# All checks are also run once from a working directory OUTSIDE the repo, by
# absolute path, to prove they don't depend on cwd (a portability audit item --
# the skill is meant to be symlinked/copied anywhere).

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Data integrity (errata schema/freshness/residue, raw dataset shape, Domain population vs prose)
        run: python3 skill/scripts/check_data_integrity.py

      - name: Broken relative markdown links + fragment anchors
        run: python3 skill/scripts/check_links.py

      - name: Domain stats reproducibility smoke test
        run: python3 skill/scripts/compute_domain_stats.py

      - name: Legend packet extraction + shape check
        run: python3 skill/scripts/check_legend_packets.py

      - name: Deck-primer worked examples follow the eight-section contract
        run: python3 skill/scripts/check_deck_primer.py

      # Fires when a mode is routed in SKILL.md but the READMEs still describe the
      # old set -- README maintenance is split from feature work, so this is what
      # tells the doc author that the code moved.
      - name: READMEs match routed modes, cited counts, and referenced paths
        run: python3 skill/scripts/check_readme_sync.py

      # Derives each system's engine-connection status from its artifacts and
      # fails if any README (or the checklist audit table) claims otherwise.
      - name: README engine-connection claims match the artifacts
        run: python3 skill/scripts/check_readme_connection_claims.py

      - name: Deck Coach schema, roles, cases, and artifact regressions
        run: python3 skill/scripts/check_deck_coach.py

      - name: Card behavior manifest and Deck Coach coverage boundary
        run: python3 skill/scripts/check_card_behavior_coverage.py

      - name: First R3 pack selection scope and source boundary
        run: python3 skill/scripts/check_r3_pack_selection.py

      - name: Deck Coach static prototype contract
        run: python3 skill/scripts/check_deck_coach_prototype.py

      # Advisory (exit 0): lists Tier 2 rows older than the last format event
      # (set release / ban wave / rules revision) so the next re-check pass has a
      # worklist. Not a failure -- stale isn't wrong, it's "worth re-checking".
      - name: Tier 2 freshness report (advisory)
        run: python3 skill/scripts/check_tier2_freshness.py

      - name: Tournament decklist store (shape, environment, cap, provenance)
        run: python3 skill/scripts/check_tournament_lists.py

      - name: P2-A manual-authority protocol regressions
        run: python3 skill/scripts/check_p2a_protocol.py

      - name: P2-A static prototype contract
        run: python3 skill/scripts/check_p2a_prototype.py

      - name: Rule Consult sources, cases, schema, and authority regressions
        run: python3 skill/scripts/check_rule_consult.py

      - name: Bilingual rules-index retrieval, ranking, and stale masking
        run: python3 skill/scripts/check_rules_index.py

      - name: Sovereign rules core timing and permission conformance
        run: python3 skill/scripts/check_rules_core.py

      - name: Typed effect IR atomic semantics and fail-closed coverage
        run: python3 skill/scripts/check_effect_ir.py

      # Properties over generated programs rather than chosen ones: a case
      # author picks inputs, and unconsciously picks the ones that work.
      - name: Effect IR purity, determinism, atomic rollback, and hash portability
        run: python3 skill/scripts/check_effect_ir_properties.py

      - name: Atomic timing and typed-effect resolution bridge
        run: python3 skill/scripts/check_resolution_bridge.py

      - name: Shared engine-check envelope and runner
        run: python3 skill/scripts/check_engine_check.py

      # Runs the commands the reference actually prints, against the bundled
      # example inputs. Documented commands otherwise rot silently -- a reader
      # finds the breakage, not CI.
      - name: Documented engine-check CLI commands and failure surface
        run: python3 skill/scripts/check_engine_check_cli.py

      # ADR-0002: the manifest is derived from the engine, so a stale committed
      # copy, an over- or under-stated capability, or a tampered build hash
      # all fail here rather than in a consumer.
      - name: Engine capability manifest derives from the engine and binds optionally
        run: python3 skill/scripts/check_capability_manifest.py

      # ADR-0003 Phase A: caller-supplied candidates only. Fails on hidden
      # information reaching a Player 2 query, on hindsight facts changing a
      # verdict, on any complete-action-set claim, and on stale fixtures.
      - name: Bounded legal-action service reaches all five verdicts and never enumerates
        run: python3 skill/scripts/check_legal_action.py

      # R5-A: measurement only. Runs every existing fixture through the real
      # engines; fails on a stale report, an empty abstention bucket, or any
      # search/policy/P2-S claim.
      - name: R5-A coverage and abstention report is deterministic and refuses learning claims
        run: python3 skill/scripts/check_r5a_report.py

      # R3-A0: the Annie / Master Yi clause inventory is generated from the
      # card snapshot plus errata; fails when stale, when a selected card does
      # not resolve to an Origins printing, when any program id appears (A0
      # builds none), or when the manifest is anything but draft.
      - name: R3-A0 clause inventory derives from card text and errata, draft only
        run: python3 skill/scripts/check_r3_inventory.py

      # C-13: R3-A1 locators, decision points, fixture drafts and decision
      # packets. Fails when stale, when a clause lacks a Core citation, or when
      # any draft smuggles an expected outcome or a program in.
      - name: R3-A1 ledger cites Core for every clause and drafts fixtures without outcomes
        run: python3 skill/scripts/check_r3a1_ledger.py

      # ADR-0006: Deck Coach consumes engine-check.v1 as rules-consistency
      # evidence only. Fails if attaching a check changes content, if the pair
      # is split, if a decision is resolved in the session, or if the prototype
      # renders anything but the shared read-only viewer.
      - name: Deck Coach engine-evidence intake is consume-only and content-preserving
        run: python3 skill/scripts/check_deck_coach_engine_intake.py

      # ADR-0005 C-14: engine-decisions.v1, derived target status, object
      # identity across non-board transitions, multi-target expansion with
      # typed instruction outcomes. Fails on caller-overridden targeting, on a
      # stale or wrong-stage decision being applied, and on a revalidation that
      # accepts an object that has been through a non-board zone.
      - name: Engine decisions, typed selectors, object identity and mistarget traces
        run: python3 skill/scripts/check_engine_decisions.py

      # ADR-0005 C-15: the play transaction is atomic — every failure after
      # payment restores the pre-play state — and the cost receipt is the only
      # evidence a cost predicate may test.
      - name: Atomic play transaction, typed cost receipts, cost predicates
        run: python3 skill/scripts/check_play_transaction.py

      # ADR-0005 C-16: return, recall and channel are three events. Fails if a
      # return keeps anything of the old object, a recall fires as a move or
      # drops damage, or a short channel claims full completion.
      - name: Return, recall and channel are distinct zone events
        run: python3 skill/scripts/check_zone_ops.py

      # ADR-0005 C-17: linked predicates read the earlier instruction's event
      # (a replaced action is not performed) and "If this kills it" is a
      # reflexive trigger built only after Cleanup with 428.5.c attribution.
      - name: Linked-result predicates and conditional reflexive triggers
        run: python3 skill/scripts/check_linked_predicates.py

      # C-18: card programs are fixtures with cited expectations; the behavior
      # manifest is derived from them passing. Fails on a claim outranking
      # its evidence, a stale clause gaining a program, or a stale output.
      - name: R3-A1 card programs pass and the behavior manifest is derived from them
        run: python3 skill/scripts/check_r3a1_programs.py

      # Source-level uniqueness: one dispatch branch per supported op in
      # _apply_one, no duplicated top-level def/class (a patch applied twice
      # once left a dead second copy of three ops).
      - name: Effect IR dispatch is unique per operation
        run: python3 skill/scripts/check_op_dispatch.py

      # ADR-0007 C-19: permanents enter by an explicit procedure; play
      # triggers fire on play completion; open-Battlefield permission is
      # checked at play. Fails on a claimed control transfer or a trigger
      # raised by mere entry.
      - name: Permanent entry, play triggers, open-Battlefield permission
        run: python3 skill/scripts/check_permanent_play.py

      # ADR-0007 C-20: the Battlefield is the target, affected units are not;
      # Bonus Damage is summed once and added before Prevent sees the amount.
      - name: Battlefield targets, criteria expansion, Bonus Damage
        run: python3 skill/scripts/check_area_and_bonus.py

      # ADR-0007 C-21: entry replacements, effective_might, and the Ending /
      # Expiration steps. Fails if anything expires before the end-of-turn
      # triggers finish or another turn's effects are cleared.
      - name: Entry replacements, conditional passives, Ending and Expiration steps
        run: python3 skill/scripts/check_turn_steps.py

      # ADR-0007 C-22: named instruction condition, Move triggers only on a
      # Move, and discard by the player's private card_selection. Fails if an
      # empty-handed discard still draws or a hand leaks into the decision.
      - name: Instruction conditions, Move triggers, private discard
        run: python3 skill/scripts/check_conditions_and_discard.py

      # ADR-0007 C-23: Deflect adds mandatory any-domain Power per choice;
      # two legal allocations are never auto-picked.
      - name: Deflect and any-domain Power allocation
        run: python3 skill/scripts/check_deflect.py

      # ADR-0007 C-24: granted replacements bind to an identity for one turn
      # and stop applying after use, expiry, or a leave-and-return.
      - name: Granted replacements
        run: python3 skill/scripts/check_granted_replacement.py

      # ADR-0008 C-26: Combat is staged and opened by explicit two-state
      # procedures; designations follow presence; triggers fire once per identity.
      - name: Combat staging, opening and designations
        run: python3 skill/scripts/check_combat_staging.py

      # Renders every engine-check.v1 outcome through the real viewer in a
      # minimal DOM. `node --check` would pass a viewer that had quietly lost
      # the authority triple or grown a control that makes a decision.
      - name: Shared engine-check viewer fixtures, rendering, and read-only invariants
        run: python3 skill/scripts/check_engine_check_view.py

      - name: Rule Consult static prototype contract
        run: python3 skill/scripts/check_rule_consult_prototype.py

      - name: Shared prototype visual and bilingual contract
        run: python3 skill/scripts/check_prototype_ui.py

      - name: Local official rules bootstrap contract (no PDF download)
        run: python3 skill/scripts/check_rules_bootstrap.py

      # The refresh tool's value is what it refuses: it cannot write outside the
      # git-ignored report directory and cannot update its own baseline.
      - name: Source-registry refresh tooling path guard and offline diff
        run: python3 skill/scripts/check_refresh_sources.py

      # Match Analyst is specified, not implemented. This validates the corpus a
      # future implementation is held to, and fails if the mode gets routed
      # without the activation gate in its product spec.
      - name: Match Analyst example logs and uncertainty fixtures
        run: python3 skill/scripts/check_match_analyst_fixtures.py

      - name: Rift Atlas bridge contract (offline, no upstream fetch)
        run: python3 skill/scripts/check_riftatlas_bridge.py

      - name: Off-cwd portability (same checks, run from /tmp by absolute path)
        run: |
          REPO="$GITHUB_WORKSPACE"
          cd "$(mktemp -d)"
          python3 "$REPO/skill/scripts/check_data_integrity.py"
          python3 "$REPO/skill/scripts/check_links.py"
          python3 "$REPO/skill/scripts/check_legend_packets.py"
          python3 "$REPO/skill/scripts/check_deck_primer.py"
          python3 "$REPO/skill/scripts/check_readme_sync.py"
          python3 "$REPO/skill/scripts/check_readme_connection_claims.py"
          python3 "$REPO/skill/scripts/check_deck_coach.py"
          python3 "$REPO/skill/scripts/check_card_behavior_coverage.py"
          python3 "$REPO/skill/scripts/check_r3_pack_selection.py"
          python3 "$REPO/skill/scripts/check_deck_coach_prototype.py"
          python3 "$REPO/skill/scripts/check_tournament_lists.py"
          python3 "$REPO/skill/scripts/check_p2a_protocol.py"
          python3 "$REPO/skill/scripts/check_p2a_prototype.py"
          python3 "$REPO/skill/scripts/check_rule_consult.py"
          python3 "$REPO/skill/scripts/check_rules_index.py"
          python3 "$REPO/skill/scripts/check_rules_core.py"
          python3 "$REPO/skill/scripts/check_effect_ir.py"
          python3 "$REPO/skill/scripts/check_effect_ir_properties.py"
          python3 "$REPO/skill/scripts/check_resolution_bridge.py"
          python3 "$REPO/skill/scripts/check_engine_check.py"
          python3 "$REPO/skill/scripts/check_engine_check_cli.py"
          python3 "$REPO/skill/scripts/check_capability_manifest.py"
          python3 "$REPO/skill/scripts/check_legal_action.py"
          python3 "$REPO/skill/scripts/check_r5a_report.py"
          python3 "$REPO/skill/scripts/check_r3_inventory.py"
          python3 "$REPO/skill/scripts/check_r3a1_ledger.py"
          python3 "$REPO/skill/scripts/check_deck_coach_engine_intake.py"
          python3 "$REPO/skill/scripts/check_engine_decisions.py"
          python3 "$REPO/skill/scripts/check_play_transaction.py"
          python3 "$REPO/skill/scripts/check_zone_ops.py"
          python3 "$REPO/skill/scripts/check_linked_predicates.py"
          python3 "$REPO/skill/scripts/check_r3a1_programs.py"
          python3 "$REPO/skill/scripts/check_op_dispatch.py"
          python3 "$REPO/skill/scripts/check_permanent_play.py"
          python3 "$REPO/skill/scripts/check_area_and_bonus.py"
          python3 "$REPO/skill/scripts/check_turn_steps.py"
          python3 "$REPO/skill/scripts/check_conditions_and_discard.py"
          python3 "$REPO/skill/scripts/check_deflect.py"
          python3 "$REPO/skill/scripts/check_granted_replacement.py"
          python3 "$REPO/skill/scripts/check_combat_staging.py"
          python3 "$REPO/skill/scripts/check_engine_check_view.py"
          python3 "$REPO/skill/scripts/check_rule_consult_prototype.py"
          python3 "$REPO/skill/scripts/check_prototype_ui.py"
          python3 "$REPO/skill/scripts/check_rules_bootstrap.py"
          python3 "$REPO/skill/scripts/check_refresh_sources.py"
          python3 "$REPO/skill/scripts/check_match_analyst_fixtures.py"
          python3 "$REPO/skill/scripts/check_riftatlas_bridge.py"
